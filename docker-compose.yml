version: '3.8'

services:
  db:
    image: postgres:16
    container_name: launchgym_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchgym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pgnet

volumes:
  postgres_data:

networks:
  pgnet:
